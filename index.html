<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circle Racer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0b0618;
      display: grid;
      place-items: center;
      font-family: "Courier New", monospace;
      color: #fff;
      overflow: hidden;
    }
    .cabinet {
      position: relative;
      padding: 18px;
      border-radius: 14px;
      background: linear-gradient(#2a1450, #150a2e);
      box-shadow: 0 0 0 4px #ff2bd6, 0 0 40px #ff2bd688, inset 0 0 30px #000;
    }
    canvas {
      display: block;
      width: min(90vw, 120vh);
      aspect-ratio: 4 / 3;
      max-height: 85vh;
      image-rendering: pixelated;
      border-radius: 6px;
    }
    /* CRT scanlines */
    .cabinet::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 6px;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
      box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
    }
    .hint {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 2px;
      color: #9be7ff;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div>
    <div class="cabinet"><canvas id="game" width="320" height="240"></canvas></div>
    <p class="hint">HOLD SPACE / TAP TO BOOST</p>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const CX = W / 2, CY = H / 2 + 8;
    const R = 70;            // racing line radius
    const TRACK_W = 34;      // asphalt width

    const car = { angle: 0, speed: 1.6, drift: 0 };
    const BASE_SPEED = 1.6, BOOST_SPEED = 3.2;
    let boosting = false;
    let laps = 0, score = 0;
    let lastAngle = 0;
    const skids = [];
    const smoke = [];

    // --- input ---
    const setBoost = (v) => { boosting = v; };
    addEventListener("keydown", (e) => { if (e.code === "Space") { setBoost(true); e.preventDefault(); } });
    addEventListener("keyup", (e) => { if (e.code === "Space") setBoost(false); });
    addEventListener("pointerdown", () => setBoost(true));
    addEventListener("pointerup", () => setBoost(false));

    // --- static background (pre-rendered once) ---
    const bg = document.createElement("canvas");
    bg.width = W; bg.height = H;
    (function drawBackground() {
      const b = bg.getContext("2d");
      // checkered grass
      for (let y = 0; y < H; y += 8)
        for (let x = 0; x < W; x += 8) {
          b.fillStyle = ((x + y) / 8) % 2 ? "#1f7a3a" : "#238a42";
          b.fillRect(x, y, 8, 8);
        }
      // curbs: red/white segments on both edges
      const segs = 48;
      for (let i = 0; i < segs; i++) {
        const a0 = (i / segs) * Math.PI * 2, a1 = ((i + 1) / segs) * Math.PI * 2;
        b.fillStyle = i % 2 ? "#fff" : "#e8203a";
        b.beginPath();
        b.arc(CX, CY, R + TRACK_W / 2 + 4, a0, a1);
        b.arc(CX, CY, R - TRACK_W / 2 - 4, a1, a0, true);
        b.fill();
      }
      // asphalt
      b.fillStyle = "#3b3b4a";
      b.beginPath();
      b.arc(CX, CY, R + TRACK_W / 2, 0, Math.PI * 2);
      b.arc(CX, CY, R - TRACK_W / 2, 0, Math.PI * 2, true);
      b.fill("evenodd");
      // dashed center line
      b.strokeStyle = "#f5d742";
      b.lineWidth = 1;
      b.setLineDash([4, 5]);
      b.beginPath();
      b.arc(CX, CY, R, 0, Math.PI * 2);
      b.stroke();
      b.setLineDash([]);
      // start/finish checker line (at angle 0 -> right side)
      for (let i = 0; i < TRACK_W / 3; i++)
        for (let j = 0; j < 2; j++) {
          b.fillStyle = (i + j) % 2 ? "#fff" : "#111";
          b.fillRect(CX + R - TRACK_W / 2 + i * 3, CY - 3 + j * 3, 3, 3);
        }
      // infield: little trees
      const trees = [[-20, -18], [18, -10], [-6, 16], [24, 20], [-28, 8]];
      for (const [tx, ty] of trees) {
        b.fillStyle = "#0e4d22";
        b.beginPath(); b.arc(CX + tx, CY + ty, 7, 0, Math.PI * 2); b.fill();
        b.fillStyle = "#16682f";
        b.beginPath(); b.arc(CX + tx - 2, CY + ty - 2, 4, 0, Math.PI * 2); b.fill();
      }
    })();

    // --- car sprite (top-down, pointing right) ---
    function drawCar(x, y, heading) {
      ctx.save();
      ctx.translate(Math.round(x), Math.round(y));
      ctx.rotate(heading);
      // shadow
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(-7, -4, 16, 10);
      // tires
      ctx.fillStyle = "#111";
      ctx.fillRect(-6, -6, 4, 2); ctx.fillRect(3, -6, 4, 2);
      ctx.fillRect(-6, 4, 4, 2);  ctx.fillRect(3, 4, 4, 2);
      // body
      ctx.fillStyle = "#ff2bd6";
      ctx.fillRect(-8, -4, 16, 8);
      ctx.fillStyle = "#c4119f";
      ctx.fillRect(-8, -4, 2, 8);           // rear spoiler
      // racing stripe
      ctx.fillStyle = "#fff";
      ctx.fillRect(-6, -1, 14, 2);
      // windshield
      ctx.fillStyle = "#6fe3ff";
      ctx.fillRect(1, -3, 3, 6);
      // headlights
      ctx.fillStyle = "#fff8a0";
      ctx.fillRect(7, -4, 1, 2); ctx.fillRect(7, 2, 1, 2);
      ctx.restore();
    }

    // --- pixel text ---
    function text(str, x, y, color, align = "left", size = 8) {
      ctx.font = `bold ${size}px "Courier New", monospace`;
      ctx.textAlign = align;
      ctx.textBaseline = "top";
      ctx.fillStyle = "#000";
      ctx.fillText(str, x + 1, y + 1);
      ctx.fillStyle = color;
      ctx.fillText(str, x, y);
    }

    // --- loop ---
    let last = performance.now(), t = 0;
    function frame(now) {
      const dt = Math.min((now - last) / 16.67, 3);
      last = now; t += dt;

      // physics-ish: ease speed toward target, drift grows with speed
      const target = boosting ? BOOST_SPEED : BASE_SPEED;
      car.speed += (target - car.speed) * 0.05 * dt;
      car.drift += ((car.speed - 1) * 0.22 - car.drift) * 0.08 * dt;
      car.angle += (car.speed / R) * dt;

      // lap counting when crossing angle 0
      const wrapped = car.angle % (Math.PI * 2);
      if (wrapped < lastAngle) laps++;
      lastAngle = wrapped;
      score += Math.round(car.speed * 10 * dt);

      // radius wobbles outward when drifting hard
      const r = R + car.drift * 10;
      const x = CX + Math.cos(car.angle) * r;
      const y = CY + Math.sin(car.angle) * r;
      const heading = car.angle + Math.PI / 2 + car.drift;

      // skid marks from rear tires
      if (car.drift > 0.12) {
        const bx = -6 * Math.cos(heading), by = -6 * Math.sin(heading);
        const sx = 5 * Math.cos(heading + Math.PI / 2), sy = 5 * Math.sin(heading + Math.PI / 2);
        skids.push({ x: x + bx + sx, y: y + by + sy, life: 1 });
        skids.push({ x: x + bx - sx, y: y + by - sy, life: 1 });
        if (Math.random() < 0.5 * dt)
          smoke.push({ x: x + bx, y: y + by, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, life: 1, s: 2 + Math.random() * 2 });
      }

      // draw
      ctx.drawImage(bg, 0, 0);

      for (let i = skids.length - 1; i >= 0; i--) {
        const s = skids[i];
        s.life -= 0.004 * dt;
        if (s.life <= 0) { skids.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(15,15,20,${s.life * 0.55})`;
        ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
      }

      drawCar(x, y, heading);

      for (let i = smoke.length - 1; i >= 0; i--) {
        const p = smoke[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.s += 0.08 * dt; p.life -= 0.025 * dt;
        if (p.life <= 0) { smoke.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(230,230,240,${p.life * 0.6})`;
        ctx.fillRect(Math.round(p.x - p.s / 2), Math.round(p.y - p.s / 2), Math.round(p.s), Math.round(p.s));
      }

      // boost flame
      if (boosting && Math.floor(t / 3) % 2 === 0) {
        ctx.save();
        ctx.translate(Math.round(x), Math.round(y));
        ctx.rotate(heading);
        ctx.fillStyle = "#ffb000"; ctx.fillRect(-12, -1, 4, 2);
        ctx.fillStyle = "#ff3b00"; ctx.fillRect(-14, -1, 2, 2);
        ctx.restore();
      }

      // HUD
      ctx.fillStyle = "rgba(11,6,24,0.75)";
      ctx.fillRect(0, 0, W, 18);
      text("1UP", 6, 5, "#ff2bd6");
      text(String(score).padStart(7, "0"), 26, 5, "#fff");
      text(`LAP ${String(laps).padStart(3, "0")}`, W / 2, 5, "#f5d742", "center");
      text(`${Math.round(car.speed * 60)} KM/H`, W - 6, 5, boosting ? "#ff6b3b" : "#6fe3ff", "right");

      if (Math.floor(t / 30) % 2 === 0)
        text("INSERT COIN", W / 2, H - 14, "#9be7ff", "center");

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
