# Marktdaten täglich: Auktionsergebnisse und Angebote abrufen, Modell rechnen, prüfen, in die Datenbank laden und die
# Datendateien committen. Der Push löst das Deployment auf Vercel aus. Siehe motrkt/scripts/market/README.md.
#
# Rohdaten (Arbeitsordner von update.sh) liegen zwischen den Läufen im Actions-Cache. Fehlt der Cache (erster Lauf,
# oder 7 Tage ohne Lauf), beginnt der Lauf mit leerem Ordner und holt alles seit 2015 neu (dauert einige Stunden);
# ein vorhandener Arbeitsordner lässt sich stattdessen über das Secret MIP_SEED_URL (zip oder tar.gz) einspielen.
# check.py verhindert, dass ein unvollständiger Neuabruf die Daten ersetzt.
# Secrets: DATABASE_URL (Postgres, optional), MIP_SEED_URL (optional).
name: Marktdaten täglich

# Startzeiten: GitHub startet geplante Läufe oft Stunden zu spät, besonders zur vollen Stunde. Deshalb mehrere Termine
# zu einer ungeraden Minute ab kurz nach Mitternacht (Zeiten in UTC; MEZ = UTC+1, MESZ = UTC+2). Der erste, der
# tatsächlich startet, holt die Daten; die späteren sehen den Commit „Marktdaten vom <heute>“ und beenden sich sofort.
on:
  schedule:
    - cron: "37 23 * * *" # 0:37 MEZ / 1:37 MESZ
    - cron: "37 0 * * *" # 1:37 MEZ / 2:37 MESZ
    - cron: "37 1 * * *" # 2:37 MEZ / 3:37 MESZ
    - cron: "37 2 * * *" # 3:37 MEZ / 4:37 MESZ
    - cron: "37 4 * * *" # 5:37 MEZ / 6:37 MESZ, Reserve
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marktdaten
  cancel-in-progress: false

jobs:
  # geplante Läufe: nichts tun, wenn ein früherer Termin heute schon Daten geholt hat (von Hand gestartet: immer)
  heute:
    runs-on: ubuntu-24.04
    env:
      TZ: Europe/Berlin
    outputs:
      erledigt: ${{ steps.check.outputs.erledigt }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 30
      - name: Heute schon aktualisiert?
        id: check
        run: |
          HEUTE="Marktdaten vom $(date +%d.%m.%Y)"
          if [ "${{ github.event_name }}" = "schedule" ] && git log -30 --format=%s | grep -qx "$HEUTE"; then
            echo "$HEUTE ist schon da, nichts zu tun."
            echo "erledigt=1" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: heute
    if: needs.heute.outputs.erledigt != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      TZ: Europe/Berlin
    steps:
      # vor dem Checkout: ~/mipwork liegt außerhalb des Repos (~/work wäre das Arbeitsverzeichnis des Runners selbst)
      - name: Rohdaten vom letzten Lauf
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/mipwork
          key: marktdaten-${{ github.run_id }}
          restore-keys: marktdaten-

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: motrkt/package-lock.json

      - run: npm ci
        working-directory: motrkt

      - name: Rohdaten erstmalig einspielen
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          SEED_URL: ${{ secrets.MIP_SEED_URL }}
        run: |
          if [ -d ~/mipwork/web ]; then exit 0; fi
          if [ -z "$SEED_URL" ]; then
            echo "::warning::Keine Rohdaten im Cache: Neuabruf aller Quellen seit 2015."
            mkdir -p ~/mipwork/web
            exit 0
          fi
          curl -fsSL "$SEED_URL" -o /tmp/seed
          mkdir -p /tmp/seedx
          unzip -q /tmp/seed -d /tmp/seedx 2>/dev/null || tar -xzf /tmp/seed -C /tmp/seedx
          OLD=$(find /tmp/seedx -path '*/web/sales_old.csv' | head -1)
          if [ -z "$OLD" ]; then echo "::error::Archiv enthält kein web/sales_old.csv"; exit 1; fi
          mv "$(dirname "$(dirname "$OLD")")" ~/mipwork
          du -sh ~/mipwork

      - name: Aktualisieren
        working-directory: motrkt
        env:
          MIP_PUSH: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh scripts/market/daily.sh ~/mipwork

      - name: Log
        if: always()
        run: cat ~/mipwork/web/update-$(date +%F).log 2>/dev/null || true

      - name: Rohdaten-Ordner vorhanden?
        id: work
        if: always()
        run: if [ -d ~/mipwork/web ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; fi

      # auch nach einem Abbruch: die Abrufe bis dahin sind gültig und müssen morgen nicht wiederholt werden
      - name: Rohdaten für den nächsten Lauf
        if: always() && steps.work.outputs.ok == '1'
        uses: actions/cache/save@v4
        with:
          path: ~/mipwork
          key: marktdaten-${{ github.run_id }}
